name: Update contribution grid

on:
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update README contribution grid
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: Eymenonar
          MIN_STARS: '1000'
        run: python scripts/update_contrib_grid.py
      - name: Commit changes
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m "docs: update contribution grid"
          git push
